name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Validate source
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements.txt ruff==0.16.7 pip-audit==2.10.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip_audit -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and smoke test
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: ./build.ps1 -PythonExecutable (Get-Command python).Source
      - name: Publish versioned package and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $releaseVersion = (Get-Content VERSION -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          gh release create "v$releaseVersion" "dist/wifirecon-$releaseVersion-win64.zip" dist/SHA256SUMS.txt --target $env:RELEASE_COMMIT --title "wifirecon $releaseVersion" --notes 'Windows portable package. Download the ZIP and SHA256SUMS.txt, verify the SHA-256 checksum, and extract the complete folder before running wifirecon.exe. Folder installations update by extracting a new package. The executable is not code-signed.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
