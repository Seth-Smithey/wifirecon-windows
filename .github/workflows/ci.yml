name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.7
      - run: ruff check .

  test:
    name: self-checks (py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these even to start offscreen.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - run: pip install -r requirements.txt

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      # Synthetic data and offscreen Qt require no wireless adapter.
      - name: Run the 75 self-checks
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m tools.verify

  build:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and smoke-test the complete folder package
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: ./build.ps1 -PythonExecutable (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: wifirecon-windows
          path: |
            dist/wifirecon-*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
