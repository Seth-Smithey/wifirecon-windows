name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: self-checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these even to start offscreen.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - run: pip install -r requirements.txt

      # The suite runs on Linux rather than Windows on purpose. Everything
      # platform-specific — wlanapi, WinRT tethering, PnP recovery — is behind
      # an IS_WINDOWS guard, so a Windows runner with no wireless adapter would
      # exercise those paths and fail for reasons that say nothing about the
      # change under test. What CI can prove is that the parsers, database,
      # detections, services and every Qt view still build and behave. The
      # hardware paths are verified by hand against the Alfa.
      - name: Run the 75 self-checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.verify
